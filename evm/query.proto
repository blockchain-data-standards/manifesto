syntax = "proto3";

package bds.evm;
option go_package = "github.com/blockchain-data-standards/manifesto/evm";

import "models.proto";
import "rpc.proto";

// The eth_query* methods follow Monad MIP-16 (JSON-RPC Query Methods).
// Field names of the *FieldSelection messages are exactly the MIP-16 JSON
// field names: the JSON-RPC parser maps a requested name to the selection
// field of the same name.

enum SortOrder {
  ASC = 0;
  DESC = 1;
}

// A block reference as MIP-16 renders fromBlock, toBlock and cursorBlock.
message CursorBlock {
  uint64 number = 1;
  bytes hash = 2;
  bytes parentHash = 3;
}

// MIP-16 `blocks` schema.
message BlockFieldSelection {
  reserved 24;
  reserved "transactionCount";

  bool number = 1;
  bool timestamp = 2;
  bool hash = 3;
  bool parentHash = 4;
  bool stateRoot = 5;
  bool transactionsRoot = 6;
  bool receiptsRoot = 7;
  bool logsBloom = 8;
  bool gasLimit = 9;
  bool gasUsed = 10;
  bool miner = 11;
  bool extraData = 12;
  bool size = 13;
  bool sha3Uncles = 14;
  bool nonce = 15;
  bool baseFeePerGas = 16;
  bool difficulty = 17;
  bool totalDifficulty = 18;
  bool mixHash = 19;
  bool blobGasUsed = 20;
  bool excessBlobGas = 21;
  bool withdrawalsRoot = 22;
  bool parentBeaconBlockRoot = 23;
  bool requestsHash = 25;
}

// MIP-16 `transactions` schema: transaction fields merged with receipt fields.
// The blob fields exist for generic chains; the Monad schema excludes them.
message TransactionFieldSelection {
  bool hash = 1;
  bool nonce = 2;
  bool from = 3;
  bool to = 4;
  bool value = 5;
  bool input = 6;
  bool type = 7;
  // The gas limit of the transaction.
  bool gas = 8;
  bool gasPrice = 9;
  bool maxFeePerGas = 10;
  bool maxPriorityFeePerGas = 11;
  bool gasUsed = 12;
  bool effectiveGasPrice = 13;
  bool blockNumber = 14;
  bool blockHash = 15;
  bool transactionIndex = 16;
  bool blockTimestamp = 17;
  bool chainId = 18;
  bool accessList = 19;
  bool maxFeePerBlobGas = 20;
  bool blobVersionedHashes = 21;
  bool r = 22;
  bool s = 23;
  bool v = 24;
  bool yParity = 25;
  bool status = 26;
  bool cumulativeGasUsed = 27;
  bool contractAddress = 28;
  bool logsBloom = 29;
  bool authorizationList = 30;
}

// MIP-16 `logs` schema.
message LogFieldSelection {
  bool address = 1;
  bool topics = 2;
  bool data = 3;
  bool blockNumber = 4;
  bool blockHash = 5;
  bool transactionHash = 6;
  bool transactionIndex = 7;
  bool logIndex = 8;
  bool blockTimestamp = 9;
  bool removed = 10;
}

// MIP-16 `traces` schema.
message TraceFieldSelection {
  reserved 1, 2, 11, 17;
  reserved "traceType", "callType", "subtraces", "blockTimestamp";

  bool type = 18;
  bool from = 3;
  bool to = 4;
  bool value = 5;
  bool gas = 8;
  bool gasUsed = 9;
  bool input = 6;
  bool output = 7;
  bool error = 10;
  bool reverted = 19;
  bool blockHash = 16;
  bool blockNumber = 15;
  bool transactionHash = 13;
  bool transactionIndex = 14;
  bool traceAddress = 12;
}

// MIP-16 `transfers` schema, which is the same as the `traces` schema.
message TransferFieldSelection {
  reserved 9;
  reserved "blockTimestamp";

  bool type = 10;
  bool from = 1;
  bool to = 2;
  bool value = 3;
  bool gas = 11;
  bool gasUsed = 12;
  bool input = 13;
  bool output = 14;
  bool error = 15;
  bool reverted = 16;
  bool blockHash = 7;
  bool blockNumber = 6;
  bool transactionHash = 4;
  bool transactionIndex = 5;
  bool traceAddress = 8;
}

message BlockFilter {
  repeated bytes miner = 1;
}

message TransactionFilter {
  repeated bytes from = 1;
  repeated bytes to = 2;
  repeated bytes selector = 3;
}

message LogFilter {
  repeated bytes address = 1;
  repeated TopicFilter topics = 2;
}

message TraceFilter {
  reserved 4;
  reserved "isTopLevel";

  repeated bytes from = 1;
  repeated bytes to = 2;
  repeated bytes selector = 3;
  // Absent or false: the server must not return traces with reverted = true.
  optional bool includeReverted = 5;
}

message TransferFilter {
  reserved 3;
  reserved "isTopLevel";

  repeated bytes from = 1;
  repeated bytes to = 2;
  // Absent or false: the server must not return transfers with reverted = true.
  optional bool includeReverted = 4;
}

// Common request fields: fromBlock and toBlock hold a QUANTITY or one of the
// tags latest, earliest, safe, finalized; absent means the order-dependent
// MIP-16 default. target is the target number of primary objects per page.
// The next page starts at fromBlock = previous cursorBlock.number + 1 (asc)
// or - 1 (desc). chainId is a gRPC-only routing field, not a JSON key.

message QueryBlocksRequest {
  reserved 5;
  reserved "cursor";

  optional string fromBlock = 1;
  optional string toBlock = 2;
  optional SortOrder order = 3;
  optional uint32 target = 4;
  optional uint64 chainId = 6;

  BlockFieldSelection blockFields = 10;
  BlockFilter filter = 11;
}

message QueryTransactionsRequest {
  reserved 5;
  reserved "cursor";

  optional string fromBlock = 1;
  optional string toBlock = 2;
  optional SortOrder order = 3;
  optional uint32 target = 4;
  optional uint64 chainId = 6;

  TransactionFilter filter = 10;
  TransactionFieldSelection transactionFields = 11;
  BlockFieldSelection blockFields = 12;
}

message QueryLogsRequest {
  reserved 5;
  reserved "cursor";

  optional string fromBlock = 1;
  optional string toBlock = 2;
  optional SortOrder order = 3;
  optional uint32 target = 4;
  optional uint64 chainId = 6;

  LogFilter filter = 10;
  LogFieldSelection logFields = 11;
  TransactionFieldSelection transactionFields = 12;
  BlockFieldSelection blockFields = 13;
}

message QueryTracesRequest {
  reserved 5;
  reserved "cursor";

  optional string fromBlock = 1;
  optional string toBlock = 2;
  optional SortOrder order = 3;
  optional uint32 target = 4;
  optional uint64 chainId = 6;

  TraceFilter filter = 10;
  TraceFieldSelection traceFields = 11;
  TransactionFieldSelection transactionFields = 12;
  BlockFieldSelection blockFields = 13;
}

message QueryTransfersRequest {
  reserved 5;
  reserved "cursor";

  optional string fromBlock = 1;
  optional string toBlock = 2;
  optional SortOrder order = 3;
  optional uint32 target = 4;
  optional uint64 chainId = 6;

  TransferFilter filter = 10;
  TransferFieldSelection transferFields = 11;
  TransactionFieldSelection transactionFields = 12;
  BlockFieldSelection blockFields = 13;
}

// Responses: fromBlock and toBlock are the resolved range; cursorBlock is the
// final block of the page (inclusive) and is always set.

message QueryBlocksResponse {
  repeated BlockHeader blocks = 1;
  CursorBlock fromBlock = 2;
  CursorBlock toBlock = 3;
  CursorBlock cursorBlock = 4;
}

message QueryTransactionsResponse {
  repeated Transaction transactions = 1;
  repeated BlockHeader blocks = 2;
  CursorBlock fromBlock = 3;
  CursorBlock toBlock = 4;
  CursorBlock cursorBlock = 5;
}

message QueryLogsResponse {
  repeated Log logs = 1;
  repeated Transaction transactions = 2;
  repeated BlockHeader blocks = 3;
  CursorBlock fromBlock = 4;
  CursorBlock toBlock = 5;
  CursorBlock cursorBlock = 6;
}

message QueryTracesResponse {
  repeated Trace traces = 1;
  repeated Transaction transactions = 2;
  repeated BlockHeader blocks = 3;
  CursorBlock fromBlock = 4;
  CursorBlock toBlock = 5;
  CursorBlock cursorBlock = 6;
}

message QueryTransfersResponse {
  repeated NativeTransfer transfers = 1;
  repeated Transaction transactions = 2;
  repeated BlockHeader blocks = 3;
  CursorBlock fromBlock = 4;
  CursorBlock toBlock = 5;
  CursorBlock cursorBlock = 6;
}

service QueryService {
  rpc QueryBlocks(QueryBlocksRequest) returns (stream QueryBlocksResponse);
  rpc QueryTransactions(QueryTransactionsRequest) returns (stream QueryTransactionsResponse);
  rpc QueryLogs(QueryLogsRequest) returns (stream QueryLogsResponse);
  rpc QueryTraces(QueryTracesRequest) returns (stream QueryTracesResponse);
  rpc QueryTransfers(QueryTransfersRequest) returns (stream QueryTransfersResponse);
}
