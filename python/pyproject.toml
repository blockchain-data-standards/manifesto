[project]
name = "bds"
version = "0.1.0"
description = "Python bindings for the Blockchain Data Standards (BDS) EVM protobuf definitions and gRPC stubs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Floors match the generator pinned in generate.py: its gencode checks both
# runtimes at import.
dependencies = ["grpcio>=1.85.0", "protobuf>=7.35.1,<8"]

[project.urls]
Repository = "https://github.com/blockchain-data-standards/manifesto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bds"]
